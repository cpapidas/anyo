name: Publish library

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: anyo-pypi-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reserve this run's version at its exact source commit
        id: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/prepare_release.py "$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
      - name: Push the immutable version tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"

  check:
    needs: prepare
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yml
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/anyo/${{ needs.prepare.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions-${{ github.run_id }}
          path: dist
      - name: Check existing files and stage only missing distributions
        id: existing
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/check_published.py "$RELEASE_VERSION" dist --upload-dir upload
      - name: Publish the verified artifacts
        if: steps.existing.outputs.needs_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/
      - name: Verify both published file hashes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/check_published.py "$RELEASE_VERSION" dist --verify

  release-notes:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release notes after confirmed PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --generate-notes \
              --title "Anyo $RELEASE_TAG"
          fi
