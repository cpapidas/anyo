[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "anyo"
dynamic = ["version"]
description = "A Python framework for event-driven AI pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=1.7.0",
    "uvicorn>=0.53.0",
]

[project.urls]
Repository = "https://github.com/cpapidas/anyo"
Documentation = "https://github.com/cpapidas/anyo/blob/main/docs/wiki/README.md"
Issues = "https://github.com/cpapidas/anyo/issues"
Changelog = "https://github.com/cpapidas/anyo/releases"

[project.optional-dependencies]
opencode = ["httpx2>=2.13.1"]
redis = ["redis>=5.0.8"]
dev = [
    "build",
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
    "twine",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools_scm]

[tool.anyo.release]
series = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["anyo", "anyo.*"]
namespaces = false

[tool.setuptools.package-data]
anyo = ["py.typed", "_prompt_envelope.txt"]
"anyo.integrations.omo" = ["_bridge.mjs"]
"anyo.ui" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not live'"
markers = ["live: tests requiring explicitly configured external services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/anyo"]
strict = true
